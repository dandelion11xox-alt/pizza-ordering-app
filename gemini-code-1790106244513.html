<!-- Side 2: Caesar Salad -->
<div class="bg-surface-container-lowest rounded-2xl p-space-md shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between">
  <div class="space-y-space-sm">
    <div class="w-full h-44 rounded-xl overflow-hidden relative">
      <img alt="Crisp Little Gem Caesar Salad with Shaved Parmesan" class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1550304943-4f24f54ddde9?auto=format&fit=crop&w=600&q=80"/>
      <span class="absolute bottom-2 left-2 bg-inverse-surface/85 backdrop-blur-sm px-2 py-0.5 rounded text-inverse-on-surface text-[11px] font-semibold">House Dressing</span>
    </div>
    <div class="flex items-baseline justify-between">
      <h3 class="font-headline-sm text-headline-sm text-on-surface">Insalata Cesare</h3>
      <span class="font-label-price text-label-price text-primary" id="price-salad">$6.50</span>
    </div>
    <p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-2">
      Crisp Romaine hearts, sourdough garlic croutons, 24-month Parmigiano-Reggiano, and creamy anchovy dressing.
    </p>
    <!-- Size selector -->
    <div>
      <span class="block font-label-md text-label-md uppercase tracking-wider text-on-surface-variant mb-1">Portion</span>
      <div class="grid grid-cols-2 gap-2">
        <button class="size-btn-salad py-1.5 px-2 rounded-lg bg-primary-container text-on-primary font-bold text-center font-label-md text-label-md shadow-sm transition-all" onclick="selectSize('salad', 'Side', 6.50, this)" type="button">
          <span class="block">Side Portion</span>
          <span class="text-on-primary-container font-normal">$6.50</span>
        </button>
        <button class="size-btn-salad py-1.5 px-2 rounded-lg bg-surface-container-low hover:bg-surface-container text-on-surface text-center font-label-md text-label-md transition-all" onclick="selectSize('salad', 'Entree', 10.50, this)" type="button">
          <span class="block">Full Entrée</span>
          <span class="text-on-surface-variant font-normal">$10.50</span>
        </button>
      </div>
    </div>
  </div>
  <!-- Controls -->
  <div class="flex items-center justify-between gap-space-sm pt-space-md">
    <div class="flex items-center bg-surface-container rounded-lg p-1">
      <button class="w-7 h-7 rounded-md bg-surface-container-lowest flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors font-bold text-sm" onclick="updateQty('qty-salad', -1)" type="button">

      </button>
      <span class="w-8 text-center font-title-md text-title-md text-on-surface font-semibold" id="qty-salad">1</span>

      </button>

    <button class="flex-1 py-2 px-space-md rounded-lg bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg transition-colors flex items-center justify-center gap-1.5 shadow-sm" onclick="addItemToOrder('Insalata Cesare', 'salad')" type="button">

      <span>Add to Order</span>
    </button>
